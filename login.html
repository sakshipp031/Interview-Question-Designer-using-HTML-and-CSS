<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <div class="logo">

        🎯 Interview Designer

    </div>

    <ul>

        <li><a href="/">Home</a></li>

        <li><a href="/login">Login</a></li>

    </ul>

</nav>

<div class="login-container">

    <h2>

        Welcome Back 👋

    </h2>

    <form method="POST">

        <div class="input-group">

            <label>

                Username

            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required>

        </div>

        <div class="input-group">

            <label>

                Password

            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required>

        </div>

        <button
            type="submit"
            class="generate-btn">

            Login

        </button>

    </form>

    <br>

    <center>

        <p>

            Demo Login

            <br><br>

            Enter any username and password.

        </p>

    </center>

</div>

<footer>

    © 2026 Interview Question Designer

</footer>

</body>

</html>
